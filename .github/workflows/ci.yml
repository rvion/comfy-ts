name: CI

on:
   push:
      branches: [main]
   pull_request:
      branches: [main]

concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

jobs:
   ci:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@v2
           with:
              # canary, not the marketplace default (1.3.x): bun.lock is
              # lockfileVersion 2, which older bun refuses with
              # "Unknown lockfile version" and then fails --frozen-lockfile
              bun-version: canary
         - run: bun install --frozen-lockfile
         - run: bun run ci
         - run: bun run build
