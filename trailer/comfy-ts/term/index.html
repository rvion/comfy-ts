<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="shot-ready" content="loading">
<title>comfy-ts terminal take</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<style>
   :root { --bg: #0b1220; --panel: #0d1626; --line: #1d2b45; --dim: #6c7c99; --ink: #c9d6ee; --accent: #6da2ee; }
   html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
   /* the top band stays free for the trailer's titles */
   #chrome { position: absolute; left: 56px; right: 56px; top: 172px; bottom: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
   #tabs { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--line); font: 600 15px 'JetBrains Mono', monospace; color: var(--dim); }
   #tabs .dot { width: 11px; height: 11px; border-radius: 50%; background: #2a3a58; }
   #tabs .tab { margin-left: 14px; color: var(--ink); }
   #term { position: absolute; top: 52px; left: 18px; right: 18px; bottom: 10px; }
   .xterm-viewport { overflow: hidden !important; }
</style>
</head>
<body>
<div id="chrome">
   <div id="tabs"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="tab" id="title">terminal</span></div>
   <div id="term"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-image@0.8.0/lib/addon-image.js"></script>
<script src="./replay.js"></script>
</body>
</html>
