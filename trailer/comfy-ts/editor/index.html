<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="shot-ready" content="loading">
<title>comfy-ts editor take</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
   :root { --bg: #0b1220; --panel: #0f1a2e; --line: #1d2b45; --ink: #c9d6ee; --dim: #6c7c99; --accent: #6da2ee; }
   html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
   /* the top band stays free for the trailer's titles */
   #chrome { position: absolute; left: 56px; right: 56px; top: 172px; bottom: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
   #tabs { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--line); font: 600 15px 'JetBrains Mono', monospace; color: var(--dim); }
   #tabs .dot { width: 11px; height: 11px; border-radius: 50%; background: #2a3a58; }
   #tabs .tab { margin-left: 14px; color: var(--ink); padding: 8px 12px; border-bottom: 2px solid var(--accent); }
   #editor { position: absolute; top: 41px; left: 0; right: 0; bottom: 0; }
</style>
</head>
<body>
<div id="chrome">
   <div id="tabs"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="tab"></span></div>
   <div id="editor"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script src="./kit.js"></script>
<script>document.write(`<script src="./${new URLSearchParams(location.search).get('take') ?? 'take'}.js"><\/script>`)</script>
</body>
</html>
