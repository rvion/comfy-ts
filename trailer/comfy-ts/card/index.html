<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="shot-ready" content="loading">
<title>comfy-ts end card</title>
<style>
   html, body { margin: 0; height: 100%; overflow: hidden; }
   body { background: radial-gradient(ellipse at 50% 38%, #18294a 0%, #0b1220 55%, #060a12 100%); }
   /* the icon above the name the trailer draws in the middle */
   #mark { position: absolute; left: 50%; top: 120px; width: 190px; height: 190px; transform: translateX(-50%); border-radius: 44px;
      background: #f4f7ff; box-shadow: 0 0 80px rgba(255, 176, 32, var(--glow, 0.25)), 0 20px 50px rgba(0, 0, 0, .5); }
   #mark img { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="mark"><img id="icon" src="/icon.png"></div>
<script>
   // a slow breath of the star's glow, drawn at the time the shot service asks for
   window.__trailerStep = async (t) => {
      document.body.style.setProperty('--glow', String(0.22 + 0.12 * Math.sin(t * 1.6)))
   }
   const img = document.getElementById('icon')
   const ready = () => document.querySelector('meta[name=shot-ready]').setAttribute('content', 'ready')
   img.complete ? ready() : img.addEventListener('load', ready)
</script>
</body>
</html>
